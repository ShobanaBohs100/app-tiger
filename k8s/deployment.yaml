apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-app
  namespace: sre-prototype
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-app
  template:
    metadata:
      labels:
        app: chaos-app
    spec:
      containers:
      - name: chaos-app
        # We will replace this image tag dynamically in the CI/CD pipeline
        image: ghcr.io/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME:latest 
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "latest"
        resources:
          requests:
            memory: "128Mi"   # The minimum RAM it needs to boot
            cpu: "100m"       # 1/10th of a CPU core
          limits:
            memory: "256Mi"   # THE HARD CAP: It dies if it hits this
            cpu: "250m"       # 1/4th of a CPU core